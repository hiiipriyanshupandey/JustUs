<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JustUs Chat</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08080c;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .chat-app {
      width: 100%;
      max-width: 520px;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #111116;
    }


    /* =========================
       HEADER
    ========================== */

    .chat-header {
      height: 70px;
      flex-shrink: 0;

      display: flex;
      align-items: center;

      gap: 10px;

      padding: 10px 14px;

      border-bottom: 1px solid #25252d;
    }


    .back-button {
      width: 38px;
      height: 38px;

      border: none;
      background: transparent;

      color: #fff;

      font-size: 24px;
    }


    .friend-avatar {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #1b1b22;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
    }


    .friend-info {
      flex: 1;
      min-width: 0;
    }


    .friend-name {
      font-size: 15px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    .friend-status {
      color: #777;

      font-size: 11px;

      margin-top: 3px;
    }


    .more-button {
      width: 38px;
      height: 38px;

      border: none;
      background: transparent;

      color: #aaa;

      font-size: 22px;
    }


    /* =========================
       MESSAGES
    ========================== */

    .messages {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding: 16px 14px;

      scroll-behavior: smooth;
    }


    .empty-chat {
      height: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }


    .empty-avatar {
      width: 70px;
      height: 70px;

      border-radius: 50%;

      background: #1b1b22;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;

      margin-bottom: 14px;
    }


    .empty-title {
      font-size: 15px;

      font-weight: 600;

      color: #ddd;
    }


    .empty-text {
      color: #666;

      font-size: 12px;

      margin-top: 6px;
    }


    .message-row {
      display: flex;

      margin-bottom: 8px;
    }


    .message-row.sent {
      justify-content: flex-end;
    }


    .message-row.received {
      justify-content: flex-start;
    }


    .message-bubble {
      max-width: 78%;

      padding: 9px 11px;

      border-radius: 15px;
    }


    .message-bubble.sent {
      background: #fff;

      color: #000;

      border-bottom-right-radius: 5px;
    }


    .message-bubble.received {
      background: #1c1c24;

      color: #fff;

      border-bottom-left-radius: 5px;
    }


    .message-text {
      font-size: 14px;

      line-height: 1.4;

      word-break: break-word;

      white-space: pre-wrap;
    }


    .message-time {
      margin-top: 4px;

      font-size: 9px;

      opacity: .55;

      text-align: right;
    }


    /* =========================
       COMPOSER
    ========================== */

    .composer {
      flex-shrink: 0;

      display: flex;
      align-items: center;

      gap: 7px;

      padding: 10px;

      border-top: 1px solid #25252d;

      background: #111116;
    }


    .composer-button,
    .send-button {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      border-radius: 12px;

      font-size: 17px;
    }


    .composer-button {
      border: 1px solid #292932;

      background: #15151b;

      color: #ddd;
    }


    .send-button {
      border: none;

      background: #fff;

      color: #000;

      font-weight: 700;
    }


    .send-button:disabled {
      opacity: .4;

      cursor: not-allowed;
    }


    #messageInput {
      flex: 1;

      min-width: 0;

      height: 44px;

      padding: 0 14px;

      border: 1px solid #292932;

      border-radius: 14px;

      outline: none;

      background: #0b0b10;

      color: #fff;

      font-size: 14px;
    }


    #messageInput:focus {
      border-color: #555560;
    }


    #messageInput::placeholder {
      color: #666;
    }


    /* =========================
       ERROR
    ========================== */

    .error {
      color: #ff7777;

      text-align: center;

      font-size: 12px;

      padding: 20px;
    }


    /* =========================
       SCROLLBAR
    ========================== */

    .messages::-webkit-scrollbar {
      width: 4px;
    }


    .messages::-webkit-scrollbar-track {
      background: transparent;
    }


    .messages::-webkit-scrollbar-thumb {
      background: #292932;

      border-radius: 10px;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 520px) {

      .chat-app {
        max-width: 100%;
      }

      .message-bubble {
        max-width: 82%;
      }

    }

  </style>

</head>


<body>

  <div class="chat-app">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="chat-header">

      <button
        class="back-button"
        onclick="goBack()"
        aria-label="Go back"
      >
        ←
      </button>


      <div class="friend-avatar">
        👤
      </div>


      <div class="friend-info">

        <div
          id="friendName"
          class="friend-name"
        >
          Loading...
        </div>


        <div
          id="friendStatus"
          class="friend-status"
        >
          Offline
        </div>

      </div>


      <button
        class="more-button"
        onclick="showMoreOptions()"
        aria-label="More options"
      >
        ⋮
      </button>

    </div>



    <!-- =========================
         MESSAGES
    ========================== -->

    <div
      id="messages"
      class="messages"
    >

      <div
        id="emptyChat"
        class="empty-chat"
      >

        <div class="empty-avatar">
          👤
        </div>


        <div class="empty-title">
          Start your conversation
        </div>


        <div
          id="emptyText"
          class="empty-text"
        >
          Say hello 👋
        </div>

      </div>

    </div>



    <!-- =========================
         COMPOSER
    ========================== -->

    <div class="composer">


      <button
        class="composer-button"
        onclick="showMediaMessage()"
        aria-label="Add media"
      >
        ＋
      </button>


      <input
        id="messageInput"
        type="text"
        placeholder="Message..."
        autocomplete="off"
        maxlength="2000"
      >


      <button
        class="composer-button"
        onclick="showReactionMessage()"
        aria-label="Add reaction"
      >
        😊
      </button>


      <button
        id="sendButton"
        class="send-button"
        onclick="sendMessage()"
        aria-label="Send message"
      >
        ➤
      </button>

    </div>


  </div>


  <!-- =========================
       CHAT JAVASCRIPT
  ========================== -->

  <script src="js/chat.js"></script>

</body>

</html>
