<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Space</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b0b0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #9999a6;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .card {
      background: #15151c;
      border: 1px solid #292933;
      border-radius: 18px;
      padding: 24px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #0b0b0f;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }

    .button.secondary {
      background: #20202a;
      color: #ffffff;
      border: 1px solid #30303b;
    }

    .footer {
      margin-top: 24px;
      color: #666672;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      Our Space
    </div>

    <p class="subtitle">
      A private space for two.
    </p>

    <div class="card">

      <button class="button">
        Create Account
      </button>

      <button class="button secondary">
        Log In
      </button>

    </div>

    <div class="footer">
      Private • Simple • Just Us
    </div>

  </main>

</body>
</html>
