<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JustUs</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b0b0f;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px 20px;
    }

    .app {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      margin-top: 80px;
      margin-bottom: 40px;
    }

    .logo h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .logo p {
      color: #92929d;
      font-size: 14px;
    }

    .card {
      background: #15151b;
      border: 1px solid #292931;
      border-radius: 18px;
      padding: 24px;
    }

    .tabs {
      display: flex;
      background: #0f0f14;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab {
      width: 50%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #888894;
      font-size: 14px;
      cursor: pointer;
    }

    .tab.active {
      background: #ffffff;
      color: #111111;
      font-weight: 600;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      font-size: 13px;
      color: #b0b0ba;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border-radius: 10px;
      border: 1px solid #303039;
      background: #0e0e13;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #777783;
    }

    .button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #111;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    .forgot {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #92929d;
      font-size: 12px;
      text-decoration: none;
    }

    .note {
      text-align: center;
      margin-top: 25px;
      color: #666670;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">
      <h1>JustUs</h1>
      <p>A private space for two.</p>
    </div>

    <div class="card">

      <div class="tabs">
        <button class="tab active" onclick="showForm('login')">
          Log In
        </button>

        <button class="tab" onclick="showForm('signup')">
          Create Account
        </button>
      </div>


      <!-- LOGIN -->

      <div id="login" class="form active">

        <label>Email</label>
        <input
          type="email"
          placeholder="you@example.com"
        >

        <label>Password</label>
        <input
          type="password"
          placeholder="Your password"
        >

        <button class="button">
          Log In
        </button>

        <a href="#" class="forgot">
          Forgot password?
        </a>

      </div>


      <!-- SIGN UP -->

      <div id="signup" class="form">

        <label>Username</label>
        <input
          type="text"
          placeholder="@yourusername"
        >

        <label>Email</label>
        <input
          type="email"
          placeholder="you@example.com"
        >

        <label>Password</label>
        <input
          type="password"
          placeholder="Create a password"
        >

        <button class="button">
          Create Account
        </button>

      </div>

    </div>

    <p class="note">
      Private • Simple • JustUs
    </p>

  </main>


  <script>

    function showForm(formName) {

      document
        .getElementById("login")
        .classList.remove("active");

      document
        .getElementById("signup")
        .classList.remove("active");

      document
        .getElementById(formName)
        .classList.add("active");


      const tabs = document.querySelectorAll(".tab");

      tabs.forEach(tab => {
        tab.classList.remove("active");
      });


      if (formName === "login") {
        tabs[0].classList.add("active");
      } else {
        tabs[1].classList.add("active");
      }

    }

  </script>

</body>
</html>
